name: Telegram Notify

on:
  workflow_call:
    inputs:
      project_name:
        description: "Project name"
        required: false
        type: string
        default: ""
      status:
        description: "Status text"
        required: true
        type: string
      message:
        description: "Extra message"
        required: false
        type: string
        default: ""
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: true
      TELEGRAM_CHAT_ID:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram notification
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROJECT_NAME: ${{ inputs.project_name }}
          STATUS: ${{ inputs.status }}
          EXTRA_MESSAGE: ${{ inputs.message }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u

          TEXT="GitHub 通知
          项目：${PROJECT_NAME:-$REPOSITORY}
          仓库：$REPOSITORY
          Workflow：$WORKFLOW_NAME
          Run：#$RUN_NUMBER
          状态：$STATUS"

          if [ -n "$EXTRA_MESSAGE" ]; then
            TEXT="$TEXT
          说明：$EXTRA_MESSAGE"
          fi

          TEXT="$TEXT
          查看运行：$RUN_URL"

          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(curl --silent --show-error \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}")"

          echo "Telegram API HTTP status: ${HTTP_CODE}"
          echo "Telegram API response:"
          cat "$RESPONSE_FILE"
          echo

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Telegram notification failed. Check the API description above."
            exit 1
          fi

          echo "Telegram notification sent successfully."
